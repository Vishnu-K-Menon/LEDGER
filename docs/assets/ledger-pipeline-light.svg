<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486" width="1000" height="486" role="img" aria-labelledby="ttl dsc">
<title id="ttl">LEDGER pipeline</title>
<desc id="dsc">Built document pipeline (fetch, parse, chunk, index) feeding a designed answer loop: retrieve, generate, decompose, verify, route; unsupported claims go to a repair step (delete, rewrite or re-retrieve) that loops back.</desc>
<style>
 text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
 .t { font-size: 14px; font-weight: 600; fill: #1f2328; }
 .s { font-size: 11.5px; fill: #59636e; }
 .h { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #59636e; text-anchor: start; }
 .el { font-size: 11px; fill: #59636e; }
 .lg { font-size: 12px; fill: #59636e; text-anchor: start; }
 .b { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; }
 .p { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 4; }
 .ab { fill: none; stroke: #1a7f37; stroke-width: 2; }
 .ap { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
 .ar { fill: none; stroke: #0969da; stroke-width: 1.6; stroke-dasharray: 5 4; }
 @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
</style>
<defs>
 <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
 <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
 <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
</defs>
<text class="h" x="32" y="40">DOCUMENT PIPELINE</text>
<text class="h" x="968" y="184" style="text-anchor:end">ANSWER LOOP · DESIGNED, NOT BUILT YET</text>
<circle class="pulse" r="5" fill="#0969da" opacity="0.9"><animateMotion dur="9s" repeatCount="indefinite" path="M834,230 H904 V308 H665 V392 H122 V230 H834"/></circle>

<rect class="b" x="32" y="56" width="200" height="76" rx="10"/>
<text class="t" x="132.0" y="83">Fetch</text>
<text class="s" x="132.0" y="103">seeded draw</text>
<text class="s" x="132.0" y="119">SHA-256 manifest</text>
<rect class="b" x="262" y="56" width="250" height="76" rx="10"/>
<text class="t" x="387.0" y="83">Parse</text>
<text class="s" x="387.0" y="103">Docling +</text>
<text class="s" x="387.0" y="119">text-layer table fix</text>
<rect class="b" x="542" y="56" width="190" height="76" rx="10"/>
<text class="t" x="637.0" y="83">Chunk</text>
<text class="s" x="637.0" y="103">row-split tables</text>
<text class="s" x="637.0" y="119">header on every slice</text>
<rect class="b" x="762" y="56" width="206" height="76" rx="10"/>
<text class="t" x="865.0" y="83">Index</text>
<text class="s" x="865.0" y="103">Qwen3-Embedding-4B</text>
<text class="s" x="865.0" y="119">Qdrant</text>
<path class="ab" d="M232,94 H260" marker-end="url(#mb)"/>
<path class="ab" d="M512,94 H540" marker-end="url(#mb)"/>
<path class="ab" d="M732,94 H760" marker-end="url(#mb)"/>
<path class="ap" d="M865,132 V158 H122 V190" marker-end="url(#mp)"/>
<rect class="p" x="32" y="192" width="180" height="76" rx="10"/>
<text class="t" x="122.0" y="219">1 · Retrieve</text>
<text class="s" x="122.0" y="239">Qwen3-Reranker-0.6B</text>
<text class="s" x="122.0" y="255">top 30 → top 5</text>
<rect class="p" x="232" y="192" width="180" height="76" rx="10"/>
<text class="t" x="322.0" y="219">2 · Generate</text>
<text class="s" x="322.0" y="239">Claude Sonnet 5</text>
<text class="s" x="322.0" y="255">strict grounding · Batch</text>
<rect class="p" x="432" y="192" width="170" height="76" rx="10"/>
<text class="t" x="517.0" y="219">3 · Decompose</text>
<text class="s" x="517.0" y="239">single-fact claims</text>
<text class="s" x="517.0" y="255">Claimify-style</text>
<rect class="p" x="622" y="192" width="212" height="76" rx="10"/>
<text class="t" x="728.0" y="219">4 · Verify</text>
<text class="s" x="728.0" y="239">local 7–8B verifier</text>
<text class="s" x="728.0" y="255">one claim at a time</text>
<path class="p" d="M904,192 L944,230 L904,268 L864,230 Z"/>
<text class="t" x="904" y="235" style="font-size:12.5px">5 · Route</text>
<path class="ap" d="M212,230 H230" marker-end="url(#mp)"/>
<path class="ap" d="M412,230 H430" marker-end="url(#mp)"/>
<path class="ap" d="M602,230 H620" marker-end="url(#mp)"/>
<path class="ap" d="M834,230 H862" marker-end="url(#mp)"/>
<rect class="p" x="540" y="350" width="250" height="64" rx="10"/>
<text class="t" x="665.0" y="377">Repair · one action per run</text>
<text class="s" x="665.0" y="397">delete · rewrite · re-retrieve</text>
<rect class="p" x="840" y="350" width="128" height="64" rx="10"/>
<text class="t" x="904.0" y="377">Answer</text>
<text class="s" x="904.0" y="397">with citations</text>
<path class="ap" d="M904,268 V348" marker-end="url(#mp)"/>
<text class="el" x="912" y="316" style="text-anchor:start">all supported</text>
<text class="el" x="912" y="330" style="text-anchor:start">or budget hit</text>
<path class="ar" d="M904,308 H665 V348" marker-end="url(#ma)"/>
<text class="el" x="780" y="300" style="fill:#0969da">unsupported claims</text>
<path class="ar" d="M575,350 V302 H517 V270" marker-end="url(#ma)"/>
<text class="el" x="546" y="296" style="fill:#0969da">rewrite</text>
<path class="ar" d="M540,392 H122 V270" marker-end="url(#ma)"/>
<text class="el" x="330" y="386" style="fill:#0969da">re-retrieve: fetch new evidence</text>
<path class="ar" d="M790,382 H838" marker-end="url(#ma)"/>
<text class="el" x="814" y="374" style="fill:#0969da">delete</text>
<rect class="b" x="32" y="448" width="26" height="16" rx="4"/><text class="lg" x="66" y="461">built</text>
<rect class="p" x="120" y="448" width="26" height="16" rx="4"/><text class="lg" x="154" y="461">designed, not built yet</text>
<text class="lg" x="330" y="461">v1 fixes the repair action per experiment run; the moving dot traces the designed loop.</text>
</svg>