# D-039 item 3: parse the FRESH held-out units with the current corpus converter, apart from the
# corpus. Overrides ONLY paths - the four the parse stage reads and writes (ledger/ingest/parse.py:
# 189 parsed_dir, 258 raw_dir, 432/478 manifest, 483 chunks) plus reports_dir, because
# `ledger ingest --stage parse` also writes `<paths.reports_dir>/a9_pilot.md` (ledger/cli.py) and
# must not overwrite the pilot's reports/a9_pilot.md (owner, 2026-09-30). Every parser and chunker
# setting is inherited unchanged from configs/base.yaml.
paths:
  manifest: data/manifest_fresh.jsonl
  raw_dir: data/raw_fresh
  parsed_dir: data/parsed_fresh
  chunks: data/chunks_fresh.jsonl
  reports_dir: reports/a1_fresh
