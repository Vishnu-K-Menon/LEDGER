[project]
name = "ledger"
version = "0.1.0"
description = "LEDGER v1 — Loop with Evidence-Decomposed Grounding and Error Repair"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    # D-018: pins corrected from D-017's 0.1.29 / >=0.1.57 (0.1.29 has no `evaluations` constant).
    "openinference-semantic-conventions==0.1.37",
    "openinference-instrumentation==0.1.63",
    "anthropic>=1.5",
    # T2 (D-034): pinned exactly - the Docling lesson.
    "requests==2.34.2",
    "pypdf==6.19.0",
    # T3 (D-033): Docling pinned exactly. `docling` is a meta-package over
    # `docling-slim[standard]`; the models and parser backends are pinned too, not just the
    # two top-level names, so a transitive bump cannot change a parse.
    "docling==2.129.0",
    "docling-core==2.97.1",
    "docling-ibm-models==4.0.3",
    "docling-parse==7.20.0",
    # D-039 production port (ledger/ingest/rows.py): the row fix reads the PDF text layer with
    # the exact versions the frozen rung-1b emitter ran under (port parity gate).
    "pdfplumber==0.11.10",
    "pdfminer-six==20260107",
    # T4 (D-002, D-011, D-012): exact pins. torch/transformers/huggingface-hub were transitive
    # (via docling) at these versions; pinned directly so the embedder, reranker and verifier
    # loads cannot drift. einops + sentencepiece: the MiniCheck remote code (InternLM2) imports
    # them; no vllm, no minicheck package.
    "qdrant-client==1.19.1",
    "einops==0.8.2",
    "sentencepiece==0.2.2",
    "torch==2.14.0",
    "transformers==5.17.0",
    "huggingface-hub==1.32.0",
]

[project.scripts]
ledger = "ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["parse: T3 tests that import docling/torch (slow to collect)"]
