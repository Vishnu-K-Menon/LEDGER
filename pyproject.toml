[project]
name = "ledger"
version = "0.1.0"
description = "LEDGER v1 — Loop with Evidence-Decomposed Grounding and Error Repair"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    # D-018: pins corrected from D-017's 0.1.29 / >=0.1.57 (0.1.29 has no `evaluations` constant).
    "openinference-semantic-conventions==0.1.37",
    "openinference-instrumentation==0.1.63",
    "anthropic>=1.5",
]

[project.scripts]
ledger = "ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
